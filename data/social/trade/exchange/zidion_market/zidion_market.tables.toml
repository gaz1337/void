# ---------------------------------------------------------------------------------------------
# Campaigns - the manipulation plays.
#
#   weight       relative chance of being picked
#   duration     ticks the play runs for (600ms each; 3000 = 30 minutes)
#   move         percent the price is pushed over the duration, in `direction`
#   direction    1 up, -1 down, 0 sideways (the move is used as extra jitter instead)
#   volume       percent of normal volume printed while it runs (300 = three times)
#   report       the line the market report shows; $item is the commodity, $sector its sector
#   hints        what the traders say near the desk while it runs. Hint, never name it outright.
# ---------------------------------------------------------------------------------------------
[zidion_market_campaigns]
row_id = "string"
weight = "int"
duration = "range"
move = "range"
direction = "int"
volume = "int"
report = "string"
hints = "list<string>"

[.pump]
weight = 25
duration = [3000, 7000]
move = [20, 55]
direction = 1
volume = 300
report = "Sustained buying in $item. Somebody is building a position."
hints = [
    "Someone has been buying every $item on the board for an hour now.",
    "If you are holding $item, hold. Just hold.",
    "Whoever is stacking $item has deeper pockets than the rest of us combined.",
    "Watch the $sector board. Something is moving and it is not us.",
    "Three of my $item asks got lifted before I could blink.",
]

[.dump]
weight = 20
duration = [2000, 5000]
move = [15, 45]
direction = -1
volume = 300
report = "Heavy selling in $item. The floor is soaking up stock."
hints = [
    "Big seller in $item. Bids are getting hit as fast as they go up.",
    "I would not be buying $item today. Someone wants out badly.",
    "The $sector board is red and it is one account doing it.",
    "Somebody is unloading $item like it is on fire.",
]

[.squeeze]
weight = 10
duration = [1500, 3500]
move = [50, 120]
direction = 1
volume = 500
report = "A squeeze in $item - sellers have vanished and buyers are chasing."
hints = [
    "There is not a single $item ask left on the board. Not one.",
    "Whoever shorted $item is about to have a very bad afternoon.",
    "Buyers are chasing $item up. Nobody wants to be the one without.",
]

[.whale]
weight = 15
duration = [4000, 9000]
move = [10, 25]
direction = 1
volume = 600
report = "Whale activity in $item - enormous size trading through quietly."
hints = [
    "Some whale is quietly hoovering up $item. Quietly for now.",
    "You know when a price does not move and volume triples? $item. Right now.",
    "The clerks look nervous every time that one comes back for more $item.",
    "Do not fight the big money on $item. Follow it or stay out.",
]

[.crash]
weight = 10
duration = [1000, 2500]
move = [30, 65]
direction = -1
volume = 500
report = "$item is crashing. Panic selling across the $sector board."
hints = [
    "$item just fell out of bed. Get out of the way.",
    "Everybody is selling $item at once. Who started it?",
    "This is what a crash looks like. Remember $item today.",
    "I have never seen the $sector board this red.",
]

[.rumour]
weight = 10
duration = [1500, 4000]
move = [5, 15]
direction = 0
volume = 200
report = "Rumours around $item. Prices swinging on talk, not trades."
hints = [
    "Heard something about $item. Cannot say what. Cannot say who.",
    "There is a rumour going round the desk about $item. Half of it is probably true.",
    "Somebody knows something about $item and it is not me.",
]

[.quiet]
weight = 10
duration = [2000, 4000]
move = [0, 0]
direction = 0
volume = 60
report = "A quiet session. Prices drifting on thin volume."
hints = [
    "Dead quiet today. Even the whales are asleep.",
    "Nothing moving. Good day to stock up before the next play.",
]

# ---------------------------------------------------------------------------------------------
# Traders - the bots on the exchange floor. Row id is the account name they log in with.
#
#   style   maker   quotes bids and asks on the busiest commodities
#           whale   runs the campaigns: lifts asks in a pump, dumps stock in a crash
#           scalper takes player offers that sit inside the take band
#           crier   talks the most, trades the least
#   tile    where they stand in the Grand Exchange
# ---------------------------------------------------------------------------------------------
[zidion_market_traders]
row_id = "string"
style = "string"
tile = "tile"

