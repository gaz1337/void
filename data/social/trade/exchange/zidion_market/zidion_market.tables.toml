# Zidion market - the simulated commodity exchange.
#
# Read by content/zidion/ZidionMarket.kt (prices, campaigns, prints, the clerk desk, tax) and
# ZidionTradingBots.kt (the trading bots and the order book). Everything tunable lives here; the
# scripts hold no gameplay numbers and no player-facing text.
#
# How the pieces fit:
#  - zidion_market_items     the commodities. Row ids are item ids and are validated at load.
#                            Their live price IS the item's `price` param, so the exchange screens,
#                            the price checker and item values all move with the market.
#  - zidion_market_campaigns manipulation plays. One is running most of the time; it drags the
#                            price of one commodity towards a target and multiplies its volume.
#  - zidion_market_traders   the trading bots standing in the exchange. They quote real bids and
#                            asks into the order book, take player offers, run the campaigns and
#                            gossip about them. Their coins and stock are the treasury account's.
#  - zidion_market_rules     every dial.
#  - zidion_market_lines     what the traders say when nothing in particular is going on.

# ---------------------------------------------------------------------------------------------
# Commodities
#
#   sector      grouping for the report
#   volatility  typical daily swing, percent
#   volume      typical items traded per hour when nothing is going on (synthetic prints)
#   lot         a normal trade size; quotes are lot * quote_lots
# ---------------------------------------------------------------------------------------------
[zidion_market_items]
row_id = "item"
sector = "string"
volatility = "int"
volatility_default = 6
volume = "int"
volume_default = 300
lot = "int"
lot_default = 10

