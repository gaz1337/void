# ---------------------------------------------------------------------------------------------
# Rules - all the numbers.
# ---------------------------------------------------------------------------------------------
[zidion_market_rules]
row_id = "string"
value = "int"

# Ticks between market steps (50 = 30 seconds). Every step moves prices and prints trades.
[.step_ticks]
value = 50

# Per-step pull of a price back towards its base, in basis points of the gap. 10 = 0.1% per
# step: a pump unwinds over about six hours once it stops, not in minutes.
[.reversion_bps]
value = 10

# Scale of the random walk. 100 = a commodity with volatility N moves about N% over a day.
[.noise_percent]
value = 100

# Hard cap on one step's move, in basis points (300 = 3%).
[.max_step_bps]
value = 300

# Price bounds as a percent of the base guide price.
[.floor_percent]
value = 30
[.ceiling_percent]
value = 400

# Percent of commodities that print a synthetic trade each step.
[.print_percent]
value = 40

# How many campaigns can run at once, and the ticks between one ending and the next starting.
[.campaigns]
value = 2
[.campaign_gap_ticks]
value = 600

# Ticks between trader passes. Each pass makes at most ONE new offer: the exchange samples
# same-priced offers by age and throws if two were created in the same millisecond.
[.pass_ticks]
value = 4

# Half-spread the makers quote around the market price, in basis points.
[.spread_bps]
value = 200

# How far inside the market price a resting player offer may sit and still get taken.
[.take_bps]
value = 300

# A quote further than this from the current price is cancelled and re-quoted.
[.requote_bps]
value = 600

# Quote size in lots (see zidion_market_items.lot).
[.quote_lots]
value = 4

# Most a single bid may lock up, as a percent of the treasury balance. The house cannot go
# all-in on one bid.
[.max_escrow_percent]
value = 3

# Commodities the makers keep two-sided quotes on: the N busiest by turnover.
[.quoted_items]
value = 24

# Hours of normal volume the house is seeded with, once, when the exchange has no history yet.
[.seed_hours]
value = 6

# Coins the house is seeded with alongside that stock, as a percent of the stock's value, and
# a hard ceiling on them. Rares are never seeded: they only reach the house when a player sells one.
[.seed_coins_percent]
value = 50
[.seed_coins_max]
value = 500000000

# Chatter: chance per pass that a trader near a real player says something, and the ticks a
# trader stays quiet after speaking.
[.chat_percent]
value = 70
[.chat_cooldown_ticks]
value = 12
[.hint_percent]
value = 60
[.chat_radius]
value = 12

# Chance per pass that the whale acts a running campaign out in the book instead of quoting.
[.play_percent]
value = 50

# Stale quotes pulled per pass (each cancel is processed by the exchange next tick).
[.max_cancels]
value = 2

# Seeding caps: never more than this many of one item, and only a few of anything priced
# above expensive_price (a godsword is a godsword).
[.seed_max_items]
value = 100000
[.expensive_price]
value = 1000000
[.expensive_seed]
value = 3

# Idle life on the floor: chance per pass that one trader does something - wanders a few tiles
# from its spot, plays an emote, or sits down to rest - and the radius it wanders within.
[.idle_percent]
value = 40
[.wander_radius]
value = 4

# Chance per pass that two idle traders within banter_radius strike up a conversation.
[.banter_percent]
value = 45
[.banter_radius]
value = 8

# Real trades move the price. Each fill shifts the commodity by this many basis points per one
# hour of its normal volume traded (sells push down, buys push up), capped per fill.
[.impact_bps_per_volume]
value = 150
[.impact_max_bps]
value = 400

# Board sizes.
[.top_items]
value = 100
[.report_movers]
value = 5

# ---------------------------------------------------------------------------------------------
# Idle chatter.
# ---------------------------------------------------------------------------------------------
[zidion_market_lines]
row_id = "string"
lines = "list<string>"

[.idle]
lines = [
    "Buy low, sell high. Simple. Nobody does it.",
    "The clerks see everything. The clerks say nothing.",
    "Anyone selling coal? No? Nobody ever is when I need it.",
    "I made eight million on runes last week and lost nine on herbs.",
    "Never chase. The board always comes back to you.",
    "Volume first, price second. Price lies. Volume does not.",
    "Every whale started as a minnow with a plan.",
    "You want a tip? Watch who is standing at the desk longest.",
    "Half this floor is bots. The other half is worse.",
    "Check the Top 100 before you sell anything. Then check it again.",
]

[.greeting]
lines = [
    "Here to trade or here to watch?",
    "New face. Buying or selling?",
    "Talk to the clerk if you want the report. Talk to me if you want the truth.",
]

# ---------------------------------------------------------------------------------------------
# The market clerk. clerk_menu is the five options in order: report, top 100, boards, trade,
# explain (a choice box holds five at most). clerk_explain is one chat box per line.
# ---------------------------------------------------------------------------------------------
[.clerk_welcome]
lines = ["Welcome to the Zidion market desk. Prices, plays and the Top 100 - what do you need?"]

[.clerk_menu]
lines = [
    "Show me the market report.",
    "Show me the Top 100.",
    "What are the commodity prices?",
    "I would like to trade.",
    "How does this market work?",
]

[.clerk_boards]
lines = ["Which board?"]

[.clerk_explain]
lines = [
    "Every commodity on the board has a live price. It drifts on its own, and it moves hard when somebody big decides it should.",
    "The traders on the floor quote bids and asks into the exchange. Sell into a bid and you are paid on the spot; buy from an ask and the stock is yours.",
    "The report tells you what is being played right now. The Top 100 tells you where the money is going. The rest is up to you.",
    "And the exchange takes its cut on every sale. Where that goes is the house's business.",
]

[.clerk_quiet]
lines = ["A quiet session. Prices drifting on thin volume."]

# Emote animation ids (data/entity/player/modal/tab/emote/emotes.anims.toml) the traders play
# when they are idle.
[.emotes]
lines = [
    "emote_think",
    "emote_shrug",
    "emote_yawn",
    "emote_clap",
    "emote_cheer",
    "emote_laugh",
    "emote_dance",
    "emote_headbang",
    "emote_jig",
    "emote_wave",
]

# ---------------------------------------------------------------------------------------------
# Banter between two traders: A says `first`, B answers `reply`, A may `retort` (blank = none).
# $item and $sector are filled from a running campaign when there is one.
# ---------------------------------------------------------------------------------------------
[zidion_market_banter]
row_id = "string"
first = "string"
reply = "string"
retort = "string"

[.tip]
first = "You holding any $item?"
reply = "Not since this morning. Why, what have you heard?"
retort = "Nothing. Nothing at all."

[.whale]
first = "Someone dropped forty million on $item before I had my breakfast."
reply = "Forty? I heard sixty."
retort = "Either way, I am not selling."

[.crash]
first = "Did you see the $sector board?"
reply = "I saw it. I am trying not to look at it again."
retort = ""

[.rumour]
first = "There is a rumour going round about $item."
reply = "There is always a rumour going round about something."
retort = "This one has a name attached."

[.lunch]
first = "Fancy a walk to the bank?"
reply = "Cannot. I have got bids resting."
retort = ""

[.weather]
first = "Quiet one today."
reply = "Quiet is when they get you."
retort = ""

[.knights]
first = "Knights were busy on the north road again."
reply = "Good. Keeps the robbers honest."
retort = "Honest enough to pay them, you mean."

[.newbie]
first = "New face at the desk earlier. Sold everything at market."
reply = "They will learn. Or they will not."
retort = ""

[.brag]
first = "Doubled my money on runes last week."
reply = "And lost it on herbs, I heard."
retort = "Who told you that."

[.tax]
first = "Two percent on every sale. Where does it all go?"
reply = "The house. Where else."
retort = ""
