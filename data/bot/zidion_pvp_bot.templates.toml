    { pray = { id = "leech_ranged", if = { variable = { id = "in_pvp", equals = true, default = false } } } },
    { spec_attack = { weapon = "magic_shortbow", fallback = "magic_shortbow", min_energy = 500, if = { target_hp_percent = { max = 0.3 } } } },
    { drink_potion = { item = "super_ranging_potion_*", skill = "ranged", if = { any = [{ clock = { id = "fight_starting" } }, { target_hp_percent = { max = 0.25 } }] } } },
    { drink_potion = { item = "super_restore_*", skill = "prayer" } },
    { drink_potion = { item = "super_restore_*", skill = "ranged", if = { skill_percent = { id = "ranged", max_percent = 30 } } } },
    { drink_potion = { item = "saradomin_brew_*", skill = "constitution", if = { skill_percent = { id = "constitution", max_percent = 35 } } } },
]
produces = [
    { skill = "ranged" },
    { skill = "defence" },
    { skill = "constitution" },
    { skill = "prayer" },
]

