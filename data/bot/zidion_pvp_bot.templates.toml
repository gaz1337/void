            { clock    = { id = "zidion_hold", min = 1 } },
            { clock    = { id = "zidion_loot", min = 1 } },
        ] },
    } },
    { restart = {
        wait_if = [
            { variable = { id = "in_pvp",         equals = false, default = false } },
            { variable = { id = "zidion_tribute", equals = true,  default = false } },
            { clock    = { id = "zidion_hold", min = 1 } },
            { clock    = { id = "zidion_loot", min = 1 } },
        ],
        success = { variable = { id = "zidion_retire", equals = true, default = false } },
    } },
]
reactive = [
    { eat = { heal_percent = 45 } },
